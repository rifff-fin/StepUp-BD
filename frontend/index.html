<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StepUp BD | Premium, but Affordable Sneakers</title>
    <meta
      name="description"
      content="StepUp BD: Nike, Jordan, Air Force, Adidas, Puma and New Balance sneakers at affordable prices in Bangladesh. Cash on Delivery, 7-day easy return, fast Dhaka delivery."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="StepUp BD | Premium, but Affordable." />
    <meta
      property="og:description"
      content="Authentic sneakers in Bangladesh from ৳3,000. Cash on Delivery all over BD."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font: Archivo (one variable grotesk, width 75-100); a tiny subset that only carries ৳ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@600&text=%E0%A7%B3&display=swap"
    />

    <!-- Motion preference before first paint (see src/lib/motion.ts) -->
    <script>
      (function () {
        var pref = 'auto';
        try {
          pref = localStorage.getItem('stepup:motion') || 'auto';
        } catch (e) {}
        var reduce =
          pref === 'off' ||
          (pref === 'auto' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (reduce) document.documentElement.setAttribute('data-reduced', '');
        document.documentElement.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif; color: #111; background: #fff">
        StepUp BD needs JavaScript to run the store. Please enable it and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
